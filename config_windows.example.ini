[localdb]
# 相对路径会按本项目目录解析；建议保留这一写法。
save_path = ./eeg_data

# 在 Windows 设备管理器 -> 端口（COM 和 LPT）中查看，例如 COM3。
# 只有系统中恰好一个串口时才可写 auto。
port = COM3

# 0：先不控制手套；1：启用手套串口控制。
con_flag = 0

# 保持原版时序：总试次 7 秒，其中闪烁 6 秒。
trial_dura = 7
t_stim = 6

[mi_feedback]
enabled = true
udp_ip = 127.0.0.1
udp_port = 8889
threshold = 0.013461242301178974
